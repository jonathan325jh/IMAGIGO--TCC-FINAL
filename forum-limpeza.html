<script>
const SUPABASE_URL = "https://yxsfpmqwhpvajzyrapyi.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_4N34f8bpdw9lZ-YtGJwq-w_8gC49zeW";
const CATEGORIA_PAGINA = "limpeza";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let _cacheEhDev = null;

async function checarSeEhDev() {
    if (_cacheEhDev !== null) return _cacheEhDev;
    const emails = [
        sessionStorage.getItem('usuario_email'),
        sessionStorage.getItem('dev_email')
    ].filter(Boolean);
    if (emails.length === 0) { _cacheEhDev = false; return false; }
    try {
        const { data, error } = await supabaseClient
            .from('devs').select('email').in('email', emails);
        _cacheEhDev = !error && Array.isArray(data) && data.length > 0;
    } catch (e) { _cacheEhDev = false; }
    return _cacheEhDev;
}

async function verificarPost(postId, emailAutor, nomeAutor) {
    const emails = [
        sessionStorage.getItem('usuario_email'),
        sessionStorage.getItem('dev_email')
    ].filter(Boolean);
    if (emails.length === 0) { alert('Você precisa estar logado.'); return; }

    const { data: devCheck, error: devError } = await supabaseClient
        .from('devs').select('email').in('email', emails);
    if (devError || !devCheck || devCheck.length === 0) {
        alert('Ação restrita a desenvolvedores.'); return;
    }

    const emailDevConfirmado = devCheck[0].email;
    const confirmar = confirm(
        `Confirmar que esta publicação é verdadeira e útil?\n\n` +
        `Autor: ${nomeAutor}\nEle receberá +70 XP de bônus.`
    );
    if (!confirmar) return;

    const { data: resultado, error: rpcError } = await supabaseClient
        .rpc('verificar_post_como_dev', { p_post_id: postId, p_dev_email: emailDevConfirmado });

    if (rpcError) { alert('Erro ao verificar: ' + rpcError.message); return; }
    if (!resultado || !resultado.ok) { alert('Não foi possível verificar: ' + (resultado?.erro || 'erro')); return; }

    if (resultado.ja_verificado) alert('Esta publicação já havia sido verificada.');
    else exibirNotificacao(`+70 XP para ${resultado.autor_nome || 'autor'}`, 'Publicação verificada!', 'banner-verificado.png');

    await carregarUsuarios();
    await carregarPosts();
}

function exibirNotificacao(titulo, subtitulo, caminhoImagem = 'banner-xp.png', ehLevelUp = false) {
    const container = document.getElementById('container-notificacao');
    if (!container) return;
    const toast = document.createElement('div');
    toast.className = `toast-xp ${ehLevelUp ? 'toast-level' : ''}`;
    toast.innerHTML = `
        <div class="toast-icone">
            <img src="${caminhoImagem}" alt="Ícone" style="width:100%;height:100%;object-fit:contain;">
        </div>
        <div class="toast-conteudo">
            <span class="toast-titulo">${titulo}</span>
            <span class="toast-subtitulo">${subtitulo}</span>
        </div>
        <button class="toast-fechar" onclick="fecharToast(this.parentElement)">&times;</button>
        <div class="toast-barra-progresso"></div>
    `;
    container.appendChild(toast);
    setTimeout(() => fecharToast(toast), 7000);
}

function fecharToast(toastElement) {
    if (!toastElement) return;
    toastElement.style.animation = 'slideOut 0.4s ease forwards';
    setTimeout(() => toastElement.remove(), 400);
}

async function adicionarXP(email, quantidade, motivo) {
    try {
        const { data: usuario, error } = await supabaseClient
            .from('usuarios').select('xp, level').eq('email', email).maybeSingle();
        if (error || !usuario) { console.error("Erro:", error); return; }

        const xpAtual = parseInt(usuario.xp || 0);
        const levelAtual = Math.floor(xpAtual / 100);
        const novoXp = xpAtual + quantidade;
        const novoLevel = Math.floor(novoXp / 100);

        const { error: updateError } = await supabaseClient
            .from('usuarios').update({ xp: novoXp, level: novoLevel }).eq('email', email);
        if (updateError) { console.error("Erro:", updateError); return; }

        if (usuarioAtual && usuarioAtual.email === email) usuarioAtual.level = novoLevel;

        exibirNotificacao(`+${quantidade} XP Conquistados!`, motivo, 'banner-xp.png');

        if (novoLevel > levelAtual) {
            setTimeout(() => {
                exibirNotificacao(`NÍVEL ALCANÇADO!`, `Você subiu para o Level ${novoLevel}!`, 'banner-level.png', true);
            }, 600);
        }
        localStorage.setItem('usuario_xp_atualizado', Date.now());
    } catch (err) { console.error("Erro:", err); }
}

function formatarData(dataIso) {
    if (!dataIso) return '';
    const data = new Date(dataIso);
    return data.toLocaleString('pt-BR', {
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
    });
}

function escapeHtml(texto) {
    const div = document.createElement('div');
    div.innerText = texto || '';
    return div.innerHTML;
}

let usuarioAtual = null;
let usuariosCache = {};
let devsCache = {};

let postSelecionadoId = null;
let postSelecionadoMensagem = '';

async function carregarUsuarioAtual() {
    let email = sessionStorage.getItem('usuario_email');
    if (!email) email = sessionStorage.getItem('dev_email');
    if (!email) {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session && session.user) email = session.user.email;
    }
    if (!email) { window.location.href = "login.html"; return false; }

    const ehDev = await checarSeEhDev();
    if (ehDev) {
        usuarioAtual = { nome: 'Desenvolvedor', email: email, level: 999 };
        return true;
    }

    const { data: usuario } = await supabaseClient
        .from('usuarios').select('nome, nome_personagem, email, xp, level').eq('email', email).maybeSingle();

    if (usuario) {
        const xp = Number(usuario.xp) || 0;
        usuarioAtual = {
            nome: usuario.nome_personagem || usuario.nome || email.split('@')[0],
            email: email,
            level: Math.floor(xp / 100)
        };
    } else {
        usuarioAtual = { nome: email.split('@')[0], email: email, level: 0 };
    }
    return true;
}

async function carregarUsuarios() {
    const { data, error } = await supabaseClient
        .from('usuarios').select('nome, nome_personagem, email, xp, level');
    if (error) { console.error("Erro ao carregar usuários:", error); return; }

    usuariosCache = {};
    if (data) {
        data.forEach(usuario => {
            const xp = Number(usuario.xp) || 0;
            const levelCalculado = Math.floor(xp / 100);
            const nomeExibicao = usuario.nome_personagem || usuario.nome || 'Usuário';
            const objetoUsuario = { nome: nomeExibicao, level: levelCalculado, email: usuario.email };
            if (usuario.email) usuariosCache[usuario.email] = objetoUsuario;
            if (nomeExibicao) usuariosCache[nomeExibicao] = objetoUsuario;
            if (usuario.nome) usuariosCache[usuario.nome] = objetoUsuario;
        });
    }

    try {
        const { data: devs } = await supabaseClient.from('devs').select('email');
        devsCache = {};
        if (devs) devs.forEach(d => { if (d.email) devsCache[d.email] = true; });
    } catch (e) { devsCache = {}; }
}

async function carregarPosts() {
    const lista = document.getElementById('lista-posts');
    const { data: posts, error } = await supabaseClient
        .from('posts').select('*').eq('categoria', CATEGORIA_PAGINA).order('id', { ascending: false });

    if (error) { console.error(error); lista.innerHTML = '<p>Erro ao carregar as publicações.</p>'; return; }
    if (!posts || posts.length === 0) { lista.innerHTML = '<p class="carregando">Nenhuma publicação ainda nesta categoria.</p>'; return; }

    lista.innerHTML = '';
    const ehDevAgora = await checarSeEhDev();
    for (const post of posts) await criarPost(post, lista, ehDevAgora);
}

async function criarPost(post, lista, ehDevAgora) {
    const usuario = usuariosCache[post.usuario_email] || usuariosCache[post.usuario_nome] || {
        nome: post.usuario_nome || 'Usuário', level: 0
    };

    const { data: reacoes } = await supabaseClient
        .from('post_reacoes').select('tipo, usuario_email').eq('post_id', post.id);

    const curtidas = (reacoes || []).filter(r => r.tipo === 'curtida').length;
    const naoCurtidas = (reacoes || []).filter(r => r.tipo === 'nao_curti').length;

    let minhaReacao = null;
    if (usuarioAtual && !ehDevAgora) {
        const r = (reacoes || []).find(r => r.usuario_email === usuarioAtual.email);
        if (r) minhaReacao = r.tipo;
    }

    const jaVerificado = post.verificado === true || post.verificado === 1;
    const emailEscapado = (post.usuario_email || '').replace(/'/g, "\\'");
    const nomeEscapado = (usuario.nome || '').replace(/'/g, "\\'");

    const ehAutor = usuarioAtual && post.usuario_email === usuarioAtual.email;
    const podeEditar = ehAutor || ehDevAgora;
    const mensagemEscapada = (post.mensagem || '').replace(/"/g, '&quot;').replace(/'/g, "\\'").replace(/\n/g, '\\n');

    const postEhDev = !!devsCache[post.usuario_email];
    const classePostDev = postEhDev ? 'post-dev' : '';

    const card = document.createElement('div');
    card.className = 'card-post ' + classePostDev;
    card.dataset.postId = post.id;

    card.innerHTML = `
        <div class="post-header">
            <img src="perfil.png" class="post-avatar">
            <div class="post-dados">
                <span class="post-nome">${escapeHtml(usuario.nome)}</span>
                <span class="post-level">Level ${usuario.level}</span>
                <span class="post-data">${formatarData(post.data_criacao)}</span>
            </div>
            ${podeEditar ? `
                <button class="btn-editar-post" title="Editar publicação"
                    onclick="abrirMenuPost(${post.id}, \`${mensagemEscapada}\`)">
                    <img src="gestao-btn.png" alt="Editar">
                </button>
            ` : ''}
            ${ehDevAgora && !jaVerificado ? `
                <button class="btn-verificar" title="Verificar publicação (+70 XP)"
                    onclick="verificarPost(${post.id}, '${emailEscapado}', '${nomeEscapado}')">
                    <img src="forum-correto.png" alt="Verificar" class="img-verificar">
                </button>
            ` : ''}
            ${jaVerificado ? `<span class="selo-verificado" title="Publicação verificada">
    <img src="forum-correto.png" alt="Verificado" class="img-selo-verificado">
</span>` : ''}
        </div>
        <div class="post-conteudo">${escapeHtml(post.mensagem).replace(/\n/g, '<br>')}</div>
        <div class="post-acoes">
            <button class="acao-post curtida ${minhaReacao === 'curtida' ? 'ativo' : ''}" onclick="reagir(${post.id}, 'curtida')">
                <span class="icone-acao">△</span><span class="quantidade">${curtidas}</span>
            </button>
            <button class="acao-post nao-curti ${minhaReacao === 'nao_curti' ? 'ativo' : ''}" onclick="reagir(${post.id}, 'nao_curti')">
                <span class="icone-acao">▽</span><span class="quantidade">${naoCurtidas}</span>
            </button>
            <button class="acao-post" onclick="abrirComentarios(${post.id})">
                <span class="icone-acao">💬</span><span>Comentários</span>
            </button>
        </div>
        <div class="comentarios-area" id="comentarios-${post.id}">
            <div id="lista-comentarios-${post.id}">Carregando comentários...</div>
            <form class="form-comentario" onsubmit="enviarComentario(event, ${post.id})">
                <input type="text" class="input-comentario" placeholder="Escreva um comentário..." maxlength="500" required>
                <button type="submit" class="btn-comentar">ENVIAR</button>
            </form>
        </div>
    `;
    lista.appendChild(card);
}

function abrirMenuPost(postId, mensagem) {
    postSelecionadoId = postId;
    postSelecionadoMensagem = mensagem;
    document.getElementById('menuPostOverlay').classList.add('ativo');
}

function fecharMenuPost() {
    document.getElementById('menuPostOverlay').classList.remove('ativo');
    postSelecionadoId = null;
    postSelecionadoMensagem = '';
}

function menuAcaoEditar() {
    const id = postSelecionadoId;
    const msg = postSelecionadoMensagem;
    fecharMenuPost();
    abrirModalEditar(id, msg);
}

async function menuAcaoExcluir() {
    const id = postSelecionadoId;
    fecharMenuPost();
    if (!id) return;
    if (!confirm('Tem certeza que deseja excluir esta publicação?')) return;

    const { error } = await supabaseClient.from('posts').delete().eq('id', id);
    if (error) {
        console.error(error);
        alert('Erro ao excluir publicação: ' + error.message);
        return;
    }
    exibirNotificacao('Publicação removida!', 'A postagem foi excluída.', 'banner-excluir.png');
    await carregarPosts();
}

function abrirModalEditar(postId, mensagem) {
    document.getElementById('textareaEditarPost').value = mensagem;
    document.getElementById('modalEditarPost').classList.add('ativo');
    postSelecionadoId = postId;
    setTimeout(() => document.getElementById('textareaEditarPost').focus(), 100);
}

function fecharModalEditar() {
    document.getElementById('modalEditarPost').classList.remove('ativo');
    postSelecionadoId = null;
}

async function salvarEdicaoPost() {
    const id = postSelecionadoId;
    const novaMensagem = document.getElementById('textareaEditarPost').value.trim();

    if (!id) { fecharModalEditar(); return; }
    if (!novaMensagem) {
        alert('A mensagem não pode ficar vazia.');
        return;
    }

    const { error } = await supabaseClient
        .from('posts')
        .update({ mensagem: novaMensagem })
        .eq('id', id);

    if (error) {
        console.error(error);
        alert('Erro ao editar publicação: ' + error.message);
        return;
    }

    fecharModalEditar();
    exibirNotificacao('Publicação editada!', 'Sua alteração foi salva.', 'banner-salvar.png');
    await carregarPosts();
}

async function reagir(postId, tipo) {
    if (!usuarioAtual) return;
    if (await checarSeEhDev()) return;

    const { data: existente } = await supabaseClient
        .from('post_reacoes').select('*').eq('post_id', postId).eq('usuario_email', usuarioAtual.email).maybeSingle();

    if (existente) {
        if (existente.tipo === tipo) {
            const { error } = await supabaseClient.from('post_reacoes').delete().eq('id', existente.id);
            if (error) { console.error(error); alert('Erro ao remover reação.'); return; }
        } else {
            const { error } = await supabaseClient.from('post_reacoes').update({ tipo }).eq('id', existente.id);
            if (error) { console.error(error); alert('Erro ao alterar reação.'); return; }
        }
    } else {
        const { error } = await supabaseClient.from('post_reacoes').insert({
            post_id: postId, usuario_email: usuarioAtual.email, tipo
        });
        if (error) { console.error(error); alert('Erro ao registrar reação.'); return; }
    }
    carregarPosts();
}

async function abrirComentarios(postId) {
    const area = document.getElementById(`comentarios-${postId}`);
    if (!area) return;
    area.classList.toggle('aberto');
    if (area.classList.contains('aberto')) await carregarComentarios(postId);
}

async function carregarComentarios(postId) {
    const lista = document.getElementById(`lista-comentarios-${postId}`);
    const { data: comentarios, error } = await supabaseClient
        .from('comentarios').select('*').eq('post_id', postId).order('id', { ascending: true });

    if (error) { console.error(error); lista.innerHTML = 'Erro ao carregar comentários.'; return; }
    if (!comentarios || comentarios.length === 0) { lista.innerHTML = '<p>Nenhum comentário ainda.</p>'; return; }

    const ehDevAgora = await checarSeEhDev();

    lista.innerHTML = '';
    comentarios.forEach(comentario => {
        const usuario = usuariosCache[comentario.usuario_email] || usuariosCache[comentario.usuario_nome] || {
            nome: comentario.usuario_nome || 'Usuário', level: 0
        };

        const comentarioEhDev = !!devsCache[comentario.usuario_email];
        const classeDev = comentarioEhDev ? 'comentario-dev' : '';

        const div = document.createElement('div');
        div.className = 'comentario ' + classeDev;

        const botaoExcluir = ehDevAgora ? `
            <button class="btn-excluir-comentario" title="Excluir comentário"
                onclick="excluirComentario(${comentario.id}, ${postId})">
                <img src="banner-excluir.png" alt="Excluir">
            </button>
        ` : '';

        div.innerHTML = `
            <img src="perfil.png" class="comentario-avatar">
            <div class="comentario-conteudo">
                <div>
                    <span class="comentario-nome">${escapeHtml(usuario.nome)}</span>
                    <span class="comentario-level">Level ${usuario.level}</span>
                </div>
                <div class="comentario-texto">${escapeHtml(comentario.mensagem)}</div>
                <div class="comentario-data">${formatarData(comentario.data_criacao)}</div>
            </div>
            ${botaoExcluir}
        `;
        lista.appendChild(div);
    });
}

async function excluirComentario(comentarioId, postId) {
    if (!confirm('Tem certeza que deseja excluir este comentário?')) return;

    const { error } = await supabaseClient
        .from('comentarios')
        .delete()
        .eq('id', comentarioId);

    if (error) {
        console.error(error);
        alert('Erro ao excluir comentário: ' + error.message);
        return;
    }

    exibirNotificacao('Comentário removido!', 'O comentário foi excluído.', 'banner-excluir.png');
    await carregarComentarios(postId);
}

async function enviarComentario(event, postId) {
    event.preventDefault();
    if (!usuarioAtual) return;
    if (await checarSeEhDev()) return;

    const form = event.target;
    const input = form.querySelector('.input-comentario');
    const mensagem = input.value.trim();
    if (!mensagem) return;

    const { error } = await supabaseClient.from('comentarios').insert({
        post_id: postId, usuario_nome: usuarioAtual.nome,
        usuario_email: usuarioAtual.email, mensagem
    });
    if (error) { console.error(error); alert('Erro ao enviar comentário.'); return; }
    input.value = '';
    await carregarComentarios(postId);
}

async function apagarPost(id) {
    if (!confirm('Tem certeza que deseja apagar esta publicação?')) return;
    const { error } = await supabaseClient.from('posts').delete().eq('id', id);
    if (error) { console.error(error); alert('Erro ao apagar publicação.'); return; }
    carregarPosts();
    exibirNotificacao('Publicação removida!', 'A postagem foi excluída.', 'banner-excluir.png');
}

async function publicar() {
    if (!usuarioAtual) return;

    const textarea = document.getElementById('mensagem');
    const mensagem = textarea.value.trim();
    if (!mensagem) return;

    const botao = document.getElementById('btn-publicar');
    botao.disabled = true;
    botao.textContent = 'POSTANDO...';

    const { error } = await supabaseClient.from('posts').insert({
        usuario_nome: usuarioAtual.nome, usuario_email: usuarioAtual.email,
        mensagem, categoria: CATEGORIA_PAGINA, data_criacao: new Date().toISOString()
    });

    if (error) {
        console.error(error);
        alert('Erro ao publicar a mensagem: ' + error.message);
        botao.disabled = false; botao.textContent = 'POSTAR'; return;
    }

    textarea.value = '';
    document.querySelector('.compartilhar-area').classList.remove('aberto');
    document.getElementById('areaPublicar').classList.remove('ativo');
    botao.disabled = false; botao.textContent = 'POSTAR';

    if (!(await checarSeEhDev())) {
        await adicionarXP(usuarioAtual.email, 5, 'Por criar uma nova publicação no fórum!');
    }
    await carregarUsuarios();
    await carregarPosts();
}

function ativarCompartilhar() {
    const area = document.querySelector('.compartilhar-area');
    const publicar = document.getElementById('areaPublicar');
    area.classList.add('aberto');
    publicar.classList.add('ativo');
}

document.getElementById('searchInput').addEventListener('input', function () {
    const termo = this.value.toLowerCase().trim();
    document.querySelectorAll('.card-post').forEach(card => {
        const texto = card.innerText.toLowerCase();
        card.style.display = texto.includes(termo) ? '' : 'none';
    });
});

document.addEventListener('DOMContentLoaded', async () => {
    const ok = await carregarUsuarioAtual();
    if (!ok) return;
    await carregarUsuarios();
    await carregarPosts();

    const mensagemTextarea = document.getElementById('mensagem');
    mensagemTextarea.addEventListener('focus', ativarCompartilhar);
    document.getElementById('compartilharCampo').addEventListener('click', () => mensagemTextarea.focus());
    document.getElementById('btn-publicar').addEventListener('click', publicar);
    mensagemTextarea.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); publicar(); }
    });
});

document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
        fecharMenuPost();
        fecharModalEditar();
    }
});
</script>
</body>
</html>
