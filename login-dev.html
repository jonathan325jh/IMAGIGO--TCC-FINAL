<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acesso Desenvolvedor — GIGO</title>
<link rel="stylesheet" href="login.css">

<style>
    /* ============================================================
       SÓ AS CORES ROSA + AVISO RESTRITO.
       O TAMANHO/LAYOUT VEM TODO DO login.css (igual ao login.html).
       ============================================================ */

    .aviso-restrito {
        background: #a02098;
        color: #fff;
        padding: 8px 12px;
        border-radius: 10px;
        font-size: 12px;
        font-weight: bold;
        text-align: center;
        letter-spacing: 0.5px;
        margin-bottom: 12px;
        width: 100%;
        animation: pulsarAviso 2s ease-in-out infinite;
    }

    @keyframes pulsarAviso {
        0%, 100% { box-shadow: 0 0 0 0 rgba(240, 122, 232, 0.7); }
        50%      { box-shadow: 0 0 0 10px rgba(240, 122, 232, 0); }
    }

    /* ===== CONTAINER ROSA ===== */
    .container {
        background-color: #f07ae892 !important;
        border: 4px solid #a02098 !important;
    }

    .container h1 {
        color: #fff !important;
        text-shadow: 0 2px 6px rgba(160, 32, 152, 0.4);
    }

    /* ===== INPUTS ===== */
    .container .campo input {
        background-color: rgba(255, 255, 255, 0.25) !important;
        border: 3px solid #d64ec9 !important;
        color: #fff !important;
    }

    .container .campo input::placeholder {
        color: rgba(255, 255, 255, 0.8) !important;
    }

    .container .campo input:focus {
        background-color: rgba(255, 255, 255, 0.4) !important;
        border-color: #f07ae8 !important;
        outline: none;
    }

    /* ===== BOTÃO ROSA ===== */
    .container #entrar {
        background: #d64ec9 !important;
        color: #fff !important;
        border: 3px solid #a02098 !important;
        transition: all 0.25s ease;
    }

    .container #entrar:hover:not(:disabled) {
        background: #e066d3 !important;
        transform: translateY(-2px) scale(1.02);
        box-shadow: 0 8px 18px rgba(160, 32, 152, 0.45);
    }

    .container #entrar:active:not(:disabled) {
        transform: translateY(0) scale(0.98);
    }

    .container #entrar:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    /* ===== FOTO DE PERFIL ===== */
    .container #foto-perfil {
        border: 3px solid #d64ec9;
        border-radius: 50%;
        padding: 2px;
        animation: girarPerfil 1s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes girarPerfil {
        0%   { opacity: 0; transform: scale(0.4) rotate(-180deg); }
        100% { opacity: 1; transform: scale(1)   rotate(0deg); }
    }

    /* ===== ENTRADA DO CONTAINER ===== */
    .container {
        animation: entrarDev 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes entrarDev {
        0%   { opacity: 0; transform: translateY(30px) scale(0.92); }
        100% { opacity: 1; transform: translateY(0)   scale(1); }
    }

    /* ===== MENSAGEM DE ERRO ===== */
    #erro-dev {
        color: #ff4d4d;
        font-weight: bold;
        font-size: 14px;
        text-align: center;
        width: 100%;
        min-height: 20px;
        margin-bottom: 10px;
        line-height: 1.4;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
    }

    #erro-dev.visivel {
        opacity: 1;
        animation: tremerErro 0.35s ease;
    }

    @keyframes tremerErro {
        0%, 100% { transform: translateX(0); }
        25%      { transform: translateX(-5px); }
        75%      { transform: translateX(5px); }
    }

    /* ===== BOTÃO VOLTAR ===== */
    .btn-voltar-topo {
        transition: transform 0.2s ease;
    }
    .btn-voltar-topo:hover {
        transform: scale(1.1) translateX(-3px);
    }
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
</head>

<body class="fundo">

<a href="login.html" class="btn-voltar-topo">
    <img src="voltar-bt.png" alt="Voltar">
</a>

<!-- Mantém a MESMA estrutura do login.html -->
<div class="container">
    <p id="erro-dev"></p>

    <img src="foto-login.png" id="foto-perfil" alt="Perfil">

    <h1>DESENVOLVEDOR</h1>

    <div class="aviso-restrito">Área restrita a pessoas autorizadas</div>

    <form id="dev-form" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <div class="campo">
            <input type="email" id="dev-email" placeholder="E-MAIL" required autocomplete="email">
        </div>
        <div class="campo">
            <input type="text" id="dev-codigo" placeholder="CÓDIGO DE ACESSO" required autocomplete="off">
        </div>
    </form>

    <div class="container-link-login">
        <button type="submit" id="entrar" form="dev-form">Entrar</button>
    </div>
</div>

<img src="foto-logo.png" class="logo-animada" alt="Logo">

<script src="musica.js" defer></script>

<script>
    window.addEventListener('DOMContentLoaded', () => {

        const SUPABASE_URL = "https://yxsfpmqwhpvajzyrapyi.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4c2ZwbXF3aHB2YWp6eXJhcHlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4OTU0MDAsImV4cCI6MjEwMzQ3MTQwMH0.qNgFa9lbwdqEjVFM2Su4yHchR_vtl7w9QOOrPYe1wsA";

        if (typeof supabase === 'undefined') {
            const el = document.getElementById('erro-dev');
            el.textContent = 'Falha ao carregar o sistema. Verifique sua conexão.';
            el.classList.add('visivel');
            return;
        }

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const form = document.getElementById('dev-form');
        const erroBox = document.getElementById('erro-dev');
        const btnEntrar = document.getElementById('entrar');

        function mostrarErro(texto) {
            erroBox.textContent = texto;
            erroBox.classList.remove('visivel');
            void erroBox.offsetWidth;
            erroBox.classList.add('visivel');
        }

        function limparErro() {
            erroBox.textContent = '';
            erroBox.classList.remove('visivel');
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            limparErro();

            const emailDigitado = document.getElementById('dev-email').value.trim();
            const codigoDigitado = document.getElementById('dev-codigo').value.trim();

            if (!emailDigitado || !codigoDigitado) {
                mostrarErro('Preencha e-mail e código!');
                return;
            }

            btnEntrar.disabled = true;
            btnEntrar.textContent = "Verificando...";

            try {
                const { data: devs, error } = await supabaseClient
                    .from('desenvolvedores')
                    .select('nome, email, codigo')
                    .eq('email', emailDigitado)
                    .eq('codigo', codigoDigitado)
                    .limit(1);

                if (error) {
                    console.error("Erro Supabase:", error);
                    mostrarErro('E-mail ou código incorretos!');
                    btnEntrar.disabled = false;
                    btnEntrar.textContent = "Entrar";
                    return;
                }

                if (devs && devs.length > 0) {
                    const dev = devs[0];

                    const chaves = ['usuario_email','usuario_nome','tipo_usuario','ultimo_email_usuario','dev_nome','dev_email'];
                    chaves.forEach(k => {
                        try { sessionStorage.removeItem(k); } catch(e) {}
                        try { localStorage.removeItem(k); } catch(e) {}
                    });

                    sessionStorage.setItem('dev_nome', dev.nome || '');
                    sessionStorage.setItem('dev_email', dev.email);
                    sessionStorage.setItem('tipo_usuario', 'desenvolvedor');
                    localStorage.setItem('ultimo_email_dev', dev.email);

                    window.location.href = 'pagina-entrada-dev.html';
                } else {
                    mostrarErro('E-mail ou código incorretos!');
                    btnEntrar.disabled = false;
                    btnEntrar.textContent = "Entrar";
                }

            } catch (erro) {
                console.error("Erro no acesso do desenvolvedor:", erro);
                mostrarErro('E-mail ou código incorretos!');
                btnEntrar.disabled = false;
                btnEntrar.textContent = "Entrar";
            }
        });

        document.getElementById('dev-email').addEventListener('input', limparErro);
        document.getElementById('dev-codigo').addEventListener('input', limparErro);
    });
</script>

</body>
</html>
